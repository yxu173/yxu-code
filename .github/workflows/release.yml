name: release

# Push a tag like v0.1.0 (matching package.json "version") to build, smoke-test and publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun scripts/build-release.ts --version "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v5
        with:
          name: release
          path: dist/release
      - uses: actions/upload-artifact@v5
        with:
          name: npm
          path: dist/npm

  smoke:
    needs: build
    name: smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release
          path: release
      - name: verify checksum and run
        run: |
          cd release
          grep "yxu-${{ matrix.target }}.tar.gz" checksums.txt | (shasum -a 256 -c - 2>/dev/null || sha256sum -c -)
          tar -xzf "yxu-${{ matrix.target }}.tar.gz"
          cd ..
          scripts/smoke.sh release/yxu

  github-release:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes $prerelease

  npm:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v5
        with:
          name: npm
          path: npm
      - name: publish (skipped without the NPM_TOKEN secret)
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN is not set; skipping npm publish"; exit 0; fi
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          # Platform packages first, so the wrapper's optional dependencies resolve.
          for dir in npm/yxu-*; do
            chmod +x "$dir/bin/yxu"
            npm publish "$dir" --access public --provenance --tag "$tag"
          done
          npm publish npm/yxu --access public --provenance --tag "$tag"
